<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#095A4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="泰国行程">
<title>泰国行程 · 在线共享</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Hero -->
<div class="hero">
  <h1 id="hero-title">🇹🇭 泰国完整行程</h1>
  <div class="sub" id="hero-sub">曼谷 · 芭提雅 · 清迈 · 皮皮岛 · 甲米</div>
  <div class="meta">
    <span id="meta-date">📅 2026.09.24 → 10.04</span>
    <span id="meta-group">👥 8 人团</span>
  </div>
</div>

<!-- 顶部工具条 -->
<div class="toolbar">
  <div class="toolbar-left">
    <div class="sync-status" id="sync-status">
      <span class="dot"></span><span id="sync-text">连接中…</span>
    </div>
  </div>
  <button class="fx-btn" id="btn-fx" title="汇率换算" aria-label="汇率换算">¥ ⇄ ฿ 汇率</button>
</div>

<div class="container">

  <!-- ============ 可拖拽组件容器 ============ -->
  <div id="components"></div>

  <div class="footer">
    <p>📋 米多多的泰国完整行程 · 8 人团 · 2026.09.24-10.04 · 在线协作共享版</p>
    <p>拖动组件标题左侧的 ⋮⋮（电脑）或用 ↑↓ 按钮（手机）调整顺序 · 祝旅途愉快！🎉</p>
  </div>

</div>

<!-- 编辑浮层：航班 -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header" id="modal-title">编辑航班</div>
    <div class="modal-body">
      <label>日期</label>
      <input type="text" id="f-date">
      <label>航线</label>
      <input type="text" id="f-route">
      <label>出发时间</label>
      <input type="text" id="f-dep">
      <label>到达时间</label>
      <input type="text" id="f-arr">
      <label>航班号</label>
      <input type="text" id="f-flightNo">
      <label>预订号</label>
      <input type="text" id="f-bookingNo">
      <label>状态</label>
      <select id="f-status">
        <option>已订</option>
        <option>待定</option>
        <option>已取消</option>
      </select>
      <label>备注</label>
      <input type="text" id="f-note">
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btn-del-flight" style="display:none">删除</button>
      <span style="flex:1"></span>
      <button class="btn btn-outline" id="btn-cancel">取消</button>
      <button class="btn btn-primary" id="btn-save-flight">保存</button>
    </div>
  </div>
</div>

<!-- 编辑浮层：账单 -->
<div class="modal-overlay" id="modal-bill-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">新增账单</div>
    <div class="modal-body">
      <label>币种</label>
      <select id="b-type">
        <option value="cny">¥ 人民币</option>
        <option value="thb">฿ 泰铢</option>
      </select>
      <label>事项名称</label>
      <input type="text" id="b-item" placeholder="例如：曼谷2晚住宿">
      <label>备注（可选）</label>
      <input type="text" id="b-detail" placeholder="例如：Agoda订单号xxx">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
        <div>
          <label id="b-spend-label">支出</label>
          <input type="number" step="0.01" id="b-spend" value="0">
        </div>
        <div>
          <label id="b-paid-label">实收</label>
          <input type="number" step="0.01" id="b-paid" value="0">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <span style="flex:1"></span>
      <button class="btn btn-outline" id="btn-cancel-bill">取消</button>
      <button class="btn btn-primary" id="btn-save-bill">保存</button>
    </div>
  </div>
</div>

<!-- 编辑浮层：待办 -->
<div class="modal-overlay" id="modal-todo-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">新增待办</div>
    <div class="modal-body">
      <label>分类</label>
      <select id="t-category">
        <option>机票</option><option>船票</option><option>住宿</option><option>活动</option><option>其他</option>
      </select>
      <label>内容</label>
      <input type="text" id="t-text" placeholder="例如：预订某餐厅">
      <label>日期（可选）</label>
      <input type="date" id="t-date">
    </div>
    <div class="modal-footer">
      <span style="flex:1"></span>
      <button class="btn btn-outline" id="btn-cancel-todo">取消</button>
      <button class="btn btn-primary" id="btn-save-todo">保存</button>
    </div>
  </div>
</div>

<!-- 编辑浮层：汇率换算 -->
<div class="modal-overlay" id="modal-fx-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">汇率换算</div>
    <div class="modal-body" id="fx-box"></div>
    <div class="modal-footer">
      <span style="flex:1"></span>
      <button class="btn btn-outline" id="btn-cancel-fx">关闭</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
