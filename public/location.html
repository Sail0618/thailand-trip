<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B6E99">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>📍 实时位置共享 · 泰国行程</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
:root{--text-l:var(--text-3,#8A8F8C)}
.loc-hero{background:linear-gradient(135deg,#0B6E99,#0D7D6B);color:#fff;padding:calc(26px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) 22px max(16px,env(safe-area-inset-right));text-align:center}
.loc-hero h1{font-size:1.5em;margin-bottom:6px}
.loc-hero .sub{opacity:.9;font-size:.9em}
#map{width:100%;height:calc(100vh - 330px);min-height:300px;height:calc(100dvh - 330px)}
.loc-toolbar{max-width:1000px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.loc-toolbar .info{font-size:.85em;color:var(--text-l)}
.loc-toolbar .name-input{display:flex;gap:8px;align-items:center}
.loc-toolbar input{width:120px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.9em}
.loc-toolbar .btn{padding:8px 16px;border-radius:20px;border:none;cursor:pointer;font-weight:600;font-size:.85em;min-height:44px;touch-action:manipulation}
.loc-toolbar input{font-size:16px}
.btn-start{background:#0D7D6B;color:#fff}
.btn-start.active{background:var(--accent)}
.btn-stop{background:#E85D4E;color:#fff}
.loc-status{padding:4px 14px;border-radius:12px;font-size:.8em;font-weight:600}
.loc-status.on{background:#E8F5E9;color:#2E7D32}
.loc-status.off{background:#FFEBEE;color:#C62828}
#member-list{max-width:1000px;margin:10px auto 6px;padding:0 16px;display:flex;flex-direction:column;gap:8px;max-height:224px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.member-list-title{max-width:1000px;margin:12px auto -2px;padding:0 16px;font-size:.82em;font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:6px}
.member-card{display:flex;align-items:flex-start;gap:11px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(20,30,25,.03),0 4px 12px rgba(20,30,25,.04)}
.member-card .dot{width:11px;height:11px;border-radius:50%;margin-top:5px;flex-shrink:0;box-shadow:0 0 0 3px rgba(20,30,25,.05)}
.mc-main{flex:1;min-width:0}
.mc-name{font-size:.92em;font-weight:700;color:var(--text);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mc-time{font-size:.72em;color:var(--text-3);font-weight:400;margin-left:auto;white-space:nowrap}
.mc-addr{font-size:.8em;color:var(--text-2);margin-top:3px;line-height:1.55;word-break:break-word}
.mc-addr-unknown{color:var(--text-3);font-style:italic}
.loc-empty{padding:18px;text-align:center;color:var(--text-3);font-size:.82em}
.mc-copy{flex-shrink:0;background:none;border:none;color:var(--primary,#0F766E);font-size:.76em;font-weight:600;padding:5px 8px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:2px;transition:background .15s,color .15s;line-height:1;font-family:inherit}
.mc-copy:active{background:var(--primary-l,#E6F4F1)}
.mc-copy.copied{color:var(--ok,#1F7A4D)}
.mc-nav{flex-shrink:0;background:none;border:none;color:var(--text-3,#A6ABA8);font-size:.76em;font-weight:600;padding:5px 8px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s;line-height:1;font-family:inherit}
.mc-nav:active{background:var(--primary-l,#E6F4F1);color:var(--primary,#0F766E)}
/* 地图 APP 选择底部抽屉 */
.map-sheet-overlay{position:fixed;inset:0;background:rgba(15,20,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0}
.map-sheet{background:var(--card,#fff);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:sheetUp .26s cubic-bezier(.32,.72,.32,1);max-height:72vh;overflow-y:auto}
.map-sheet-title{font-size:.92em;font-weight:700;color:var(--text);margin-bottom:12px;text-align:center}
.map-sheet-list{display:flex;flex-direction:column;gap:8px}
.map-sheet-item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;background:var(--bg,#F6F5F2);border:1px solid var(--border,#ECEAE5);font-size:.92em;font-weight:600;color:var(--text);text-decoration:none;transition:background .15s}
.map-sheet-item:active{background:var(--primary-l,#E6F4F1)}
.map-sheet-cancel{margin-top:12px;width:100%;padding:13px;border-radius:12px;background:none;border:1px solid var(--border-2,#E0DDD6);font-size:.92em;font-weight:600;color:var(--text-2,#6E7470);cursor:pointer;font-family:inherit}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.loc-toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(8px);background:rgba(20,30,25,.88);color:#fff;padding:9px 20px;border-radius:999px;font-size:.84em;z-index:999;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.loc-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{text-align:center;padding:14px max(14px,env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right));color:var(--text-l);font-size:.8em}
</style>
</head>
<body>

<div class="loc-hero">
  <h1>📍 实时位置共享</h1>
  <div class="sub">泰国行程 · 8 人团 · 防走散 / 集合找人</div>
</div>

<div class="loc-toolbar">
  <div class="info">
    <span class="loc-status off" id="loc-status">未开始共享</span>
    <span style="margin-left:8px">打开页面即自动共享 · 首次请允许定位</span>
  </div>
  <div class="name-input">
    <input type="text" id="my-name" placeholder="输入你的名字" maxlength="10">
    <button class="btn btn-start" id="btn-toggle">▶ 开始共享位置</button>
  </div>
</div>

<!-- 成员列表（放在地图上方，便于查看/复制位置） -->
<div class="member-list-title">👥 成员位置（最新更新在前）</div>
<div id="member-list"></div>

<!-- 地图容器 -->
<div id="map"></div>

<div class="loc-toast" id="loc-toast"></div>

<!-- 地图 APP 选择 -->
<div class="map-sheet-overlay" id="map-sheet" style="display:none">
  <div class="map-sheet">
    <div class="map-sheet-title">用地图打开 <span id="ms-name"></span> 的位置</div>
    <div class="map-sheet-list" id="ms-list"></div>
    <button class="map-sheet-cancel" id="ms-cancel">取消</button>
  </div>
</div>

<div class="footer">
  <p>定位仅在页面打开时更新（约每 15 秒）。手机锁屏/切后台会暂停。离开页面请点"停止共享"。</p>
  <a href="/" style="color:var(--primary)">← 返回行程主页</a>
</div>

<!-- 高德地图配置（先加载 config.js，再加载 location.js） -->
<script src="config.js"></script>
<script>
// 高德地图安全配置
window._AMapSecurityConfig = {
  securityJsCode: (window.AMAP_CONFIG && window.AMAP_CONFIG.securityCode) || "AMAP_SECURITY_CODE"
};
</script>
<script src="location.js"></script>
</body>
</html>
