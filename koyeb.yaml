# ============================================================
# Koyeb 部署配置（Koyeb App Config）
# 用法：推送到 GitHub 后，在 koyeb.com 选择 "Deploy from Dockerfile"
#      或直接用本文件创建 Service
# ============================================================
service:
  name: thailand-trip
  type: web
  health_check:
    http_path: /api/health
  ports:
    - port: 8080
      protocol: http
  instance:
    type: nano
    regions:
      - fra
      - singapore
  env:
    - key: PORT
      value: "8080"
