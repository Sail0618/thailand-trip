# ============================================================
# Render 部署配置（可选，方便起见）
# 用法：把项目推送到 GitHub 后，在 Render 选择
#      "New + → Blueprint" 并粘贴本仓库地址，即可一键部署
# 注意：如果本地运行过，data/store.json 不会被上传（见 .gitignore）
# 注意：不要手动设置 PORT，Render 会自动注入 PORT 环境变量
# ============================================================
services:
  - type: web
    name: thailand-trip
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: JSONBIN_API_KEY
        sync: false
      - key: JSONBIN_BIN_ID
        sync: false
